version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kalshi_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: pred_market_maker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - kalshi_pgdata:/var/lib/postgresql/data
      # Auto-apply schema on first boot
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

volumes:
  kalshi_pgdata:
