[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "calibr"
version = "0.1.0"
description = "Calibr: a calibration-driven market maker for Kalshi"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "websockets>=12.0",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "db*", "models*", "quoting*", "backtest*"]

[tool.pytest.ini_options]
# Run tests from the repo root so `python -m pytest` works without cd-ing.
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
