name: kalshi
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - postgresql=16        # includes pg_ctl, initdb, psql
  - pip
  - pip:
      - httpx>=0.27
      - "psycopg[binary]>=3.1"
      - numpy>=1.26
      - scikit-learn>=1.4
      - websockets>=12.0
      - cryptography>=42.0
      - python-dotenv>=1.0
      - pytest>=8.0
